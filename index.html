<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nidmegent | Japanese Esports Organization</title>

    <meta name="description"
        content="Nidmegent Official Website - Japanese Esports Organization">

    <meta name="theme-color" content="#ffffff">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
        rel="stylesheet">

    <!-- Swiper -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!--================ LOADER ================-->

    <div class="loader">

        <div class="loader__logo">

            <span>N</span>

        </div>

    </div>

    <!--================ HEADER ================-->

    <header class="header">

        <div class="container">

            <a href="#" class="logo">

                <img src="assets/logo/logo-white.png" alt="Nidmegent Logo">

            </a>

            <nav class="nav">

                <ul class="nav__list">

                    <li><a href="#about">ABOUT</a></li>

                    <li><a href="#teams">TEAMS</a></li>

                    <li><a href="#members">MEMBERS</a></li>

                    <li><a href="#results">RESULTS</a></li>

                    <li><a href="#news">NEWS</a></li>

                    <li><a href="#contact">CONTACT</a></li>

                </ul>

            </nav>

            <a href="#" class="header__button">

                JOIN US

            </a>

            <button class="menu-btn">

                <i class="ri-menu-3-line"></i>

            </button>

        </div>

    </header>

    <!--================ HERO ================-->

    <main>

        <section class="hero">

            <!-- Video -->

            <video
                autoplay
                muted
                loop
                playsinline>

                <source
                    src="assets/video/hero.mp4"
                    type="video/mp4">

            </video>

            <!-- Overlay -->

            <div class="hero__overlay"></div>

            <!-- Background Blur -->

            <div class="hero__gradient"></div>

            <!-- Hero Content -->

            <div class="hero__content">

                <p class="hero__sub">

                    JAPANESE ESPORTS ORGANIZATION

                </p>

                <h1 class="hero__title">

                    NIDMEGENT

                </h1>

                <h2 class="hero__catch">

                    CREATE<br>
                    THE NEXT ERA

                </h2>

                <p class="hero__text">

                    Building the future of competitive gaming,
                    creators and community.

                </p>

                <div class="hero__buttons">

                    <a href="#teams" class="btn btn-primary">

                        VIEW TEAM

                    </a>

                    <a href="#about" class="btn btn-secondary">

                        ABOUT US

                    </a>

                </div>

            </div>

            <!-- Left Bottom -->

            <div class="hero__left">

                Since 2023

            </div>

            <!-- Right Bottom -->

            <div class="hero__right">

                Japanese Esports Organization

            </div>

            <!-- Scroll -->

            <div class="scroll">

                <span>

                    SCROLL

                </span>

                <div class="scroll-line"></div>

            </div>

        </section>

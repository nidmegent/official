<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Common CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Player CSS -->
    <link rel="stylesheet" href="player.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="container">

        <a href="index.html" class="logo">

            <img
                src="assets/images/logo.png"
                alt="Nidmegent"
            >

        </a>


        <nav class="nav">

            <ul class="nav__list">

                <li>
                    <a href="about.html">
                        ABOUT
                    </a>
                </li>

                <li>
                    <a href="players.html">
                        PLAYERS
                    </a>
                </li>

                <li>
                    <a href="news.html">
                        NEWS
                    </a>
                </li>

                <li>
                    <a href="sponsors.html">
                        SPONSORS
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        CONTACT
                    </a>
                </li>

            </ul>

        </nav>


        <button class="menu" aria-label="menu">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

</header>



<!-- =========================================
     PLAYER PROFILE
========================================= -->

<main class="player-page">


    <!-- =====================================
         PROFILE
    ====================================== -->

    <section class="player-profile">

        <div class="player-container">


            <!-- IMAGE -->

            <div class="player-photo">

                <img
                    id="playerImage"
                    src=""
                    alt=""
                >

            </div>


            <!-- INFO -->

            <div class="player-information">


                <span
                    id="playerRole"
                    class="player-role"
                >
                    ATHLETE
                </span>


                <h1
                    id="playerName"
                    class="player-name"
                >
                    Player
                </h1>


                <div class="player-basic">

                    <span id="playerRealName">
                        -
                    </span>

                    <span id="playerBirthday">
                        -
                    </span>

                </div>


                <!-- SOCIAL -->

                <div class="player-social">

                    <a
                        id="playerX"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="X"
                    >
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>


                    <a
                        id="playerYoutube"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="YouTube"
                    >
                        <i class="fa-brands fa-youtube"></i>
                    </a>


                    <a
                        id="playerTwitch"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Twitch"
                    >
                        <i class="fa-brands fa-twitch"></i>
                    </a>

                </div>


                <!-- DESCRIPTION -->

                <div class="player-description">

                    <p id="playerDescription">
                        -
                    </p>

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================
         RESULTS
    ====================================== -->

    <section class="player-results">

        <div class="player-container">

            <h2>
                RESULT
            </h2>


            <div
                id="playerResults"
                class="result-list"
            >
            </div>

        </div>

    </section>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="footer">

    <div class="container">


        <div class="footer__top">


            <div class="footer__brand">

                <img
                    src="assets/images/logo-white.png"
                    alt="Nidmegent"
                >

                <p>
                    Keep Pushing Forward.<br>
                    Claim the Top.
                </p>

            </div>


            <div class="footer__menu">


                <div>

                    <h4>MENU</h4>

                    <a href="about.html">

                    </a>

                    <a href="players.html">
                        PLAYERS
                    </a>

                    <a href="news.html">
                        NEWS
                    </a>

                    <a href="sponsors.html">

                    </a>

                    <a href="contact.html">
                        CONTACT
                    </a>

                </div>


                <div>

                    <h4>COMPANY</h4>

                    <a href="#">
                        Mellena Studio
                    </a>

                </div>


                <div>

                    <h4>SOCIAL</h4>

                    <a href="#">
                        X
                    </a>

                    <a href="#">
                        YouTube
                    </a>

                    <a href="#">
                        Discord
                    </a>

                </div>


            </div>

        </div>


        <div class="footer__bottom">

            <span>
                © 2026 Nidmegent Esports. All Rights Reserved.
            </span>

        </div>

    </div>

</footer>
